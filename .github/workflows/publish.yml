name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x

    - name: Restore dependencies
      run: dotnet restore CoreVitals.slnx

    - name: Build Solution
      run: dotnet build CoreVitals.slnx --configuration Release --no-restore

    - name: Run Tests
      run: dotnet test CoreVitals.slnx --configuration Release --no-build --verbosity normal

    - name: Pack NuGet Package
      run: dotnet pack src/CoreVitals.Resilience/CoreVitals.Resilience.csproj --configuration Release -o ./nupkg --no-build

    - name: Push to NuGet.org
      run: dotnet nuget push "./nupkg/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
